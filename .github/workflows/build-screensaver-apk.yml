name: Build ShaderEditor screen saver APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout screensaver patch repository
        uses: actions/checkout@v4
        with:
          path: patchrepo

      - name: Checkout Shader Editor 2.36.2
        uses: actions/checkout@v4
        with:
          repository: markusfisch/ShaderEditor
          ref: c00a91a8170f1cb9dc0cb6dfab578ef9cd5b817d
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            source/**/*.gradle*
            source/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Apply and verify screen saver patches
        run: |
          git -C source apply --check ../patchrepo/patches/0001-add-shader-screensaver.patch
          git -C source apply ../patchrepo/patches/0001-add-shader-screensaver.patch
          git -C source apply --check ../patchrepo/patches/0002-remove-notification-listener.patch
          git -C source apply ../patchrepo/patches/0002-remove-notification-listener.patch
          git -C source apply --check ../patchrepo/patches/0003-add-gravitational-clock-v1.patch
          git -C source apply ../patchrepo/patches/0003-add-gravitational-clock-v1.patch
          cp patchrepo/samples/gravitational_clock_v8.glsl source/app/src/main/res/raw/sample_gravitational_clock.glsl
          grep -q 'android.permission.BIND_DREAM_SERVICE' source/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE' source/app/src/main/AndroidManifest.xml
          test -f source/app/src/main/java/de/markusfisch/android/shadereditor/service/ShaderDreamService.java
          test -f source/app/src/main/res/raw/sample_gravitational_clock.glsl
          grep -q 'sample_gravitational_clock' source/app/src/main/java/de/markusfisch/android/shadereditor/adapter/SamplesAdapter.java
          grep -q 'uniform sampler2D backbuffer' source/app/src/main/res/raw/sample_gravitational_clock.glsl

      - name: Validate Gravitational Clock v8 GLSL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator -S frag source/app/src/main/res/raw/sample_gravitational_clock.glsl

      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ShaderEditor-GravitationalClock-v8-debug
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish full modified source branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: patchrepo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan screensaver-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' ../source/ ./
          cat > SCREENSAVER_FORK.md <<'EOF'
          # Shader Editor screen saver fork

          Based on markusfisch/ShaderEditor 2.36.2 at commit
          `c00a91a8170f1cb9dc0cb6dfab578ef9cd5b817d`.

          Adds Android DreamService screen-saver support and a separate
          "Set as screen saver" shader selection.

          The sideload build removes Shader Editor's optional notification-listener
          service because Google Play Protect automatically blocks internet-sideloaded
          apps that declare that high-risk anti-fraud permission.

          Includes Gravitational Clock v8 as a built-in sample: smooth wall-clock time
          rendered as asymmetrical gravitational lensing, warped spacetime fabric,
          luminous hour/minute geodesics, and an orbiting seconds body.
          EOF
          git add -A
          git commit -m "Import ShaderEditor with Gravitational Clock v8"
          git push origin HEAD:screensaver-source --force

      - name: Prepare public release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp source/app/build/outputs/apk/debug/app-debug.apk patchrepo/ShaderEditorScreenSaver-latest-debug.apk
          cat > patchrepo/release-notes.md <<'EOF'
          Latest debug-signed build of ShaderEditorScreenSaver.

          Includes Android DreamService screen-saver support, the Play Protect compatibility fix, and the built-in Gravitational Clock v8 sample.

          This APK is intended for sideloading and is debug-signed.
          EOF

      - name: Publish public Latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: patchrepo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ShaderEditorScreenSaver-latest-debug.apk --clobber
            gh release edit latest \
              --title "ShaderEditorScreenSaver — Latest" \
              --notes-file release-notes.md
          else
            gh release create latest \
              ShaderEditorScreenSaver-latest-debug.apk \
              --verify-tag \
              --title "ShaderEditorScreenSaver — Latest" \
              --notes-file release-notes.md
          fi
